services:
  postgres:
    image: postgres:16-alpine
    container_name: lg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lg
      POSTGRES_PASSWORD: lg
      POSTGRES_DB: lg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lg -d lg"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
